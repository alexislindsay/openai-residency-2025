/* Specific stylings for the glowing butterfly */
.manifestation-glyph {
  mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 40%, rgba(0, 0, 0, 0) 100%);
  -webkit-mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 40%, rgba(0, 0, 0, 0) 100%);
  filter: drop-shadow(0 0 6px rgba(255, 255, 200, 0.4));
  transition: all 0.5s ease-in-out;
  animation: float 4s ease-in-out infinite;
}

/* Glow and pulse on hover */
.manifestation-glyph:hover {
  filter: drop-shadow(0 0 14px rgba(255, 255, 220, 0.9));
  transform: scale(1.05);
  animation: pulseGlow 2s ease-in-out infinite;
}

/* Pulse animation */
@keyframes pulseGlow {
  0%, 100% {
    transform: scale(1.05);
    filter: drop-shadow(0 0 10px rgba(255, 255, 200, 0.5));
  }
  50% {
    transform: scale(1.1);
    filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.9));
  }
}

<body>
  <h1>The Glyph Gate</h1>
  <input id="inputBox" placeholder="Say what you see." disabled />

  <div id="aboutIconWrapper" class="icon-wrapper">
    <img id="aboutIcon" class="icon" src="aboutme.png" alt="About Me" />
    <div class="icon-label-wrapper">
      <span class="icon-label">About Me</span>
    </div>
  </div>
  <div id="writeIconWrapper" class="icon-wrapper">
    <img id="writeIcon" class="icon" src="butterfiles.png" alt="Butterflies" />
    <div class="icon-label-wrapper">
      <span class="icon-label">My Writing</span>
    </div>
  </div>
  <div id="moonIconWrapper" class="icon-wrapper">
    <img id="moonIcon" class="icon" src="moon.png" alt="Moon Funnel" />
    <div class="icon-label-wrapper">
      <span class="icon-label">Lunar Quiz</span>
    </div>
  </div>
  <div id="morphIconWrapper" class="icon-wrapper">
    <img id="morphIcon" class="icon" src="morph.png" alt="Morph" />
    <div class="icon-label-wrapper">
      <span class="icon-label">Morph</span>
    </div>
  </div>
<div id="manifestIconWrapper" class="icon-wrapper">
  <img id="manifestIcon" class="icon manifestation-glyph" src="manifestations.png" alt="Manifestations" />
  <div class="icon-label-wrapper">
    <span class="icon-label">Manifestations</span>
  </div>
</div>


  <div id="aboutSection" class="content-panel">
    <img src="1.jpg" alt="About Slide 1" style="max-width:100%; margin-bottom:10px;" />
    <img src="2.jpg" alt="About Slide 2" style="max-width:100%; margin-bottom:10px;" />
    <img src="3.jpg" alt="About Slide 3" style="max-width:100%; margin-bottom:10px;" />
    <img src="4.jpg" alt="About Slide 4" style="max-width:100%;" />
  </div>

  <div id="writingSection" class="content-panel">
    <p>🦋 Capstone on social media, authenticity, and leadership</p>
    <p>🦋 Trecces Project</p>
    <p>🦋 Writing Sample 1</p>
    <p>🦋 Eisner Disney Case Study</p>
    <p>🦋 Clipboard Health Case Study</p>
  </div>

  <div id="elphant">🐘</div>

  <script>
    const input = document.getElementById("inputBox");
    const aboutSection = document.getElementById("aboutSection");
    const writingSection = document.getElementById("writingSection");
    const contentPanels = document.querySelectorAll(".content-panel");

    function typeText(text, cb) {
      input.value = "";
      let i = 0;
      const iv = setInterval(() => {
        input.value += text[i++];
        if (i === text.length) {
          clearInterval(iv);
          setTimeout(cb, 800);
        }
      }, 100);
    }

    function closeAllPanels() {
      contentPanels.forEach(panel => {
        panel.classList.remove("visible");
      });
    }

    document.getElementById("aboutIconWrapper").onclick = () => {
      closeAllPanels();
      typeText("I see you", () => {
        aboutSection.classList.add("visible");
        input.value = ""; // Clear after showing panel
      });
    };

    document.getElementById("writeIconWrapper").onclick = () => {
      closeAllPanels();
      typeText("I see it", () => {
        input.value = ""; // Clear before navigating
        window.location.href = "https://butterfiles.alexislindsay.com/";
      });
    };

    document.getElementById("moonIconWrapper").onclick = () => {
      typeText("I remember", () => {
        input.value = ""; // Clear before navigating
        window.location.href = "https://lunarquiz.carrd.co/";
      });
    };

    document.getElementById("morphIconWrapper").onclick = () => {
      typeText("I begin", () => {
        input.value = ""; // Clear before navigating
        window.location.href = "https://moon-ui-divination-portal.vercel.app/";
      });
    };

    document.getElementById("elphant").onclick = () => {
      input.value = "";
      closeAllPanels();
    };

    // Ensure labels display even if JavaScript is disabled

document.getElementById("manifestIconWrapper").onclick = () => {
  typeText("I want it", () => {
    input.value = "";
    window.location.href = "https://www.alexislindsay.shop/";
  });
};

  </script>
