<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Glyph Gate — Alexis Lindsay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(to top, #2b124c, #7b4397, #f387ab);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: white;
      position: relative;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 24px;
      text-shadow: 0 2px 14px rgba(255, 255, 255, 0.4);
      z-index: 10;
      user-select: none;
    }

    #inputBox {
      padding: 12px 24px;
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      letter-spacing: 0.1em;
      width: 320px;
      max-width: 85vw;
      text-align: center;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.35), inset 0 0 10px rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: white;
      z-index: 50;
      position: relative;
      outline: none;
      transition: all 0.3s ease;
    }

    #inputBox::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    /* Floating Glyph Container */
    .icon-wrapper {
      position: absolute;
      width: 110px;
      height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      animation: float 4s ease-in-out infinite;
      z-index: 20;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .icon-wrapper:hover {
      transform: scale(1.15) !important;
      z-index: 40;
    }

    .icon-wrapper .icon {
      width: 72px;
      height: 72px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.35));
      transition: filter 0.3s ease;
    }

    .icon-wrapper:hover .icon {
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.85));
    }

    .icon-label {
      margin-top: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
      opacity: 0.85;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }

    .icon-wrapper:hover .icon-label {
      opacity: 1;
      transform: translateY(2px);
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
    }

    /* Float Animations with Phase Offsets */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    #tarotIconWrapper    { animation-delay: 0s; }
    #aboutIconWrapper    { animation-delay: -0.6s; }
    #writeIconWrapper    { animation-delay: -1.2s; }
    #breathIconWrapper   { animation-delay: -1.8s; }
    #morphIconWrapper    { animation-delay: -2.4s; }
    #contactIconWrapper  { animation-delay: -3.0s; }
    #manifestIconWrapper { animation-delay: -3.6s; }

    /* ========================================================
       7-POINT BALANCED CONSTELLATION COORDINATES (DESKTOP)
       ======================================================== */
    /* Zenith (Top Center) */
    #tarotIconWrapper    { top: 7%; left: 50%; transform: translateX(-50%); }

    /* Upper Arc */
    #aboutIconWrapper    { top: 22%; left: 18%; }
    #writeIconWrapper    { top: 22%; right: 18%; }

    /* Mid Arc (Equator) */
    #breathIconWrapper   { top: 50%; left: 8%; transform: translateY(-50%); }
    #morphIconWrapper    { top: 50%; right: 8%; transform: translateY(-50%); }

    /* Lower Arc */
    #contactIconWrapper  { bottom: 12%; left: 20%; }
    #manifestIconWrapper { bottom: 12%; right: 20%; }

    /* Reset / Close Elephant */
    #elephant {
      position: absolute;
      top: 24px;
      right: 28px;
      cursor: pointer;
      font-size: 1.8rem;
      opacity: 0.8;
      z-index: 100;
      transition: transform 0.2s ease, opacity 0.2s ease;
      user-select: none;
    }
    #elephant:hover {
      opacity: 1;
      transform: scale(1.2);
    }

    /* Content Panels (Modals) */
    .content-panel {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -45%) scale(0.92);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      max-width: 650px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      background: rgba(18, 10, 32, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 70;
    }

    .content-panel.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .content-panel::-webkit-scrollbar { width: 6px; }
    .content-panel::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
    .content-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 3px; }

    .content-panel h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      margin-bottom: 16px;
      color: #ffd1dc;
    }

    .content-panel p {
      line-height: 1.6;
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Media Queries for Mobile & Tablet */
    @media (max-width: 768px) {
      h1 { font-size: 1.5rem; margin-bottom: 14px; }
      .icon-wrapper { width: 85px; height: 85px; }
      .icon-wrapper .icon { width: 52px; height: 52px; }
      .icon-label { font-size: 0.65rem; }

      /* Mobile Constellation */
      #tarotIconWrapper    { top: 8%; left: 50%; transform: translateX(-50%); }
      #aboutIconWrapper    { top: 22%; left: 6%; }
      #writeIconWrapper    { top: 22%; right: 6%; }
      #breathIconWrapper   { top: 42%; left: 4%; }
      #morphIconWrapper    { top: 42%; right: 4%; }
      #contactIconWrapper  { bottom: 10%; left: 8%; }
      #manifestIconWrapper { bottom: 10%; right: 8%; }
    }
  </style>
</head>
<body>

  <h1>The Glyph Gate</h1>
  <input id="inputBox" placeholder="Say what you see." disabled />

  <!-- 1. Tarot (Zenith / Moon UI Divination Portal) -->
  <div id="tarotIconWrapper" class="icon-wrapper">
    <img id="tarotIcon" class="icon tarot-icon" src="tarot.png" alt="Moon UI Tarot Portal" />
    <span class="icon-label">Tarot</span>
  </div>

  <!-- 2. About Me (Upper-Left) -->
  <div id="aboutIconWrapper" class="icon-wrapper">
    <img id="aboutIcon" class="icon" src="aboutme.png" alt="About Me" />
    <span class="icon-label">About Me</span>
  </div>

  <!-- 3. My Writing (Upper-Right) -->
  <div id="writeIconWrapper" class="icon-wrapper">
    <img id="writeIcon" class="icon" src="butterfly_chat.png" alt="Butterfly Chat" />
    <span class="icon-label">Butterfly Chat</span>
  </div>

  <!-- 4. Breathe (Mid-Left) -->
  <div id="breathIconWrapper" class="icon-wrapper">
    <img id="breathIcon" class="icon" src="breath.png" alt="LexOS Breath Portal" />
    <span class="icon-label">Breathe</span>
  </div>

  <!-- 5. Code (Mid-Right) -->
  <div id="morphIconWrapper" class="icon-wrapper">
    <img id="morphIcon" class="icon" src="morph.png" alt="Code" />
    <span class="icon-label">Code</span>
  </div>

  <!-- 6. Contact Me (Lower-Left) -->
  <div id="contactIconWrapper" class="icon-wrapper">
    <img id="contactIcon" class="icon" src="sendlove.png" alt="Contact Me" />
    <span class="icon-label">Contact Me</span>
  </div>

  <!-- 7. Manifestations (Lower-Right) -->
  <div id="manifestIconWrapper" class="icon-wrapper">
    <img id="manifestIcon" class="icon" src="manifestations.png" alt="Manifestations" />
    <span class="icon-label">Manifest</span>
  </div>

  <!-- About Slide Modal -->
  <div id="aboutSection" class="content-panel">
    <h2>About Alexis Lindsay</h2>
    <img src="1.jpg" alt="About Slide 1" style="max-width:100%; border-radius: 8px; margin-bottom:12px;" />
    <img src="2.jpg" alt="About Slide 2" style="max-width:100%; border-radius: 8px; margin-bottom:12px;" />
    <img src="3.jpg" alt="About Slide 3" style="max-width:100%; border-radius: 8px; margin-bottom:12px;" />
    <img src="4.jpg" alt="About Slide 4" style="max-width:100%; border-radius: 8px;" />
  </div>

  <!-- Writing Modal -->
  <div id="writingSection" class="content-panel">
    <h2>Selected Works & Research</h2>
    <p>🦋 Capstone on social media, authenticity, and leadership</p>
    <p>🦋 Trecces Project</p>
    <p>🦋 Writing Sample 1</p>
    <p>🦋 Eisner Disney Case Study</p>
    <p>🦋 Clipboard Health Case Study</p>
  </div>

  <!-- Reset / Clear Button -->
  <div id="elephant" title="Reset view">🐘</div>

  <script>
    const input = document.getElementById("inputBox");
    const aboutSection = document.getElementById("aboutSection");
    const writingSection = document.getElementById("writingSection");
    const contentPanels = document.querySelectorAll(".content-panel");

    function typeText(text, cb) {
      input.value = "";
      let i = 0;
      const iv = setInterval(() => {
        input.value += text[i++];
        if (i === text.length) {
          clearInterval(iv);
          setTimeout(cb, 700);
        }
      }, 90);
    }

    function closeAllPanels() {
      contentPanels.forEach(panel => panel.classList.remove("visible"));
    }

    // 1. Tarot (Moon UI Divination Portal)
    document.getElementById("tarotIconWrapper").onclick = () => {
      closeAllPanels();
      typeText("I divine", () => {
        input.value = "";
        window.location.href = "https://tarot.alexislindsay.com";
      });
    };

    // 2. About Me
    document.getElementById("aboutIconWrapper").onclick = () => {
      closeAllPanels();
      typeText("I see you", () => {
        aboutSection.classList.add("visible");
        input.value = "";
      });
    };

    // 3. Butterfly Chat
    document.getElementById("writeIconWrapper").onclick = () => {
      closeAllPanels();
      typeText("I chat", () => {
        input.value = "";
        window.location.href = "https://chat.alexislindsay.com";
      });
    };

    // 4. Breathe (LexOS Portal)
    document.getElementById("breathIconWrapper").onclick = () => {
      closeAllPanels();
      typeText("I breathe", () => {
        input.value = "";
        window.location.href = "https://breathe.alexislindsay.com";
      });
    };

    // 5. Code (GitHub)
    document.getElementById("morphIconWrapper").onclick = () => {
      closeAllPanels();
      typeText("I code", () => {
        input.value = "";
        window.location.href = "https://github.com/alexislindsay";
      });
    };

    // 6. Contact Me (Send Love)
    document.getElementById("contactIconWrapper").onclick = () => {
      closeAllPanels();
      typeText("I connect", () => {
        input.value = "";
        window.location.href = "https://sendlove-bae.vercel.app/";
      });
    };

    // 7. Manifestations
    document.getElementById("manifestIconWrapper").onclick = () => {
      closeAllPanels();
      typeText("I want it", () => {
        input.value = "";
        window.location.href = "https://www.teepublic.com/user/fap-fashion";
      });
    };

    // Elephant Reset
    document.getElementById("elephant").onclick = () => {
      input.value = "";
      closeAllPanels();
    };
  </script>
</body>
</html>
